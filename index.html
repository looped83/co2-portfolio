<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Berechnet die CO₂-Intensität (WACI) deines Portfolios aus dem DivvyDiary-Export – lokal im Browser.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080b11">
  <title>Portfolio CO₂ Analyzer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111620'/%3E%3Crect x='7' y='17' width='4' height='8' rx='2' fill='%2334d399'/%3E%3Crect x='14' y='12' width='4' height='13' rx='2' fill='%23fbbf24'/%3E%3Crect x='21' y='7' width='4' height='18' rx='2' fill='%23f87171'/%3E%3C/svg%3E">
  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:       #080b11;
      --surface:  #111620;
      --raised:   #171e2b;
      --track:    #232c40;
      --border:   #222a3c;
      --border-2: #2d3a54;
      --text:     #eaedfa;
      --muted:    #8e9cbd;
      --accent:   #60a5fa;
      /* WACI-Klassen (zugleich besser/schlechter) */
      --c-1: #34d399;
      --c-2: #60a5fa;
      --c-3: #fbbf24;
      --c-4: #f87171;

      --fs-xs: .6875rem;
      --fs-sm: .75rem;
      --fs-md: .875rem;
      --fs-lg: 1.125rem;
      --fs-xl: 2.5rem;

      --sp-1: .25rem;
      --sp-2: .5rem;
      --sp-3: .75rem;
      --sp-4: 1rem;
      --sp-5: 1.25rem;
      --sp-6: 1.5rem;
      --sp-8: 2rem;

      --r-sm: .5rem;
      --r-lg: 1rem;
      --tap: 2.25rem;
    }
    @media (pointer: coarse) { :root { --tap: 2.75rem; } }

    /* ── Basis ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 400 var(--fs-md)/1.45 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    button { font: inherit; color: inherit; }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* Farbbedeutung: setzt --c, Bausteine lesen es */
    .c1, .good { --c: var(--c-1); }
    .c2        { --c: var(--c-2); }
    .c3        { --c: var(--c-3); }
    .c4, .bad  { --c: var(--c-4); }
    .flat      { --c: var(--muted); }
    .tint      { color: var(--c, inherit); }

    /* ── Typografie ─────────────────────────────────────────── */
    .title   { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.01em; }
    .label   { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .caption { font-size: var(--fs-xs); color: var(--muted); }
    .unit    { font-size: var(--fs-sm); color: var(--muted); }
    .prose   { font-size: var(--fs-sm); line-height: 1.6; color: var(--muted); }
    .prose p + p { margin-top: var(--sp-2); }
    .prose strong { font-weight: 600; color: var(--text); }
    .row-cell, .pill, .big, .stat-value, .scale-ticks { font-variant-numeric: tabular-nums; }

    /* ── Layout ─────────────────────────────────────────────── */
    .wrap { max-width: 60rem; margin: 0 auto; padding: var(--sp-6) var(--sp-4) var(--sp-8); }
    .wrap > * + * { margin-top: var(--sp-4); }
    .grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .grid > .card { display: flex; flex-direction: column; }
    .grid > .card > .caption:last-child { margin-top: auto; padding-top: var(--sp-3); }

    /* ── Bausteine ──────────────────────────────────────────── */
    .card {
      container-type: inline-size;
      padding: var(--sp-4);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); min-height: 1.5rem; margin-bottom: var(--sp-3); }
    .card > .caption { margin-top: var(--sp-3); }
    .card-head + .caption { margin: 0 0 var(--sp-3); }
    @media (min-width: 40rem) {
      .wrap { padding-inline: var(--sp-6); }
      .card { padding: var(--sp-5); }
    }

    .pill {
      display: inline-flex; align-items: center;
      padding: .125rem var(--sp-2);
      border-radius: 999px;
      font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
      color: var(--c, var(--muted));
      background: color-mix(in srgb, var(--c, var(--muted)) 15%, transparent);
    }

    .bar { display: block; height: .375rem; overflow: hidden; background: var(--track); border-radius: .1875rem; }
    .bar > i { display: block; height: 100%; background: var(--c, var(--accent)); transform-origin: left; transform: scaleX(var(--v, 0)); }
    @keyframes grow { from { transform: scaleX(0); } }
    .anim .bar > i { animation: grow .6s cubic-bezier(.4, 0, .2, 1) both; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
      min-height: var(--tap); padding: 0 var(--sp-4);
      background: var(--raised);
      border: 1px solid var(--border-2);
      border-radius: var(--r-sm);
      font-size: var(--fs-sm); font-weight: 500; white-space: nowrap;
      cursor: pointer;
      transition: background-color .15s, border-color .15s;
    }
    .btn-block { display: flex; width: 100%; margin-top: var(--sp-3); }
    .icon { flex: none; width: 1rem; height: 1rem; }

    .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); }
    .seg button {
      min-height: calc(var(--tap) - 6px); padding: 0 var(--sp-3);
      background: none; border: 0; border-radius: .375rem;
      font-size: var(--fs-sm); color: var(--muted);
      cursor: pointer;
    }
    .seg [aria-pressed="true"] { background: var(--raised); color: var(--text); font-weight: 600; }

    @media (hover: hover) {
      .btn:hover, .drop:hover .btn { background: var(--track); border-color: var(--muted); }
      .seg button:hover { color: var(--text); }
      summary.row:hover { background: var(--raised); }
      .drop:hover { border-color: var(--muted); }
    }

    .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: var(--sp-2) var(--sp-4); }
    .facts dd { margin-top: .125rem; font-size: var(--fs-sm); }

    /* Aufklapp-Pfeil als Pseudo-Element, Kopfzeile hält denselben Platz frei */
    summary::after, .row-head::after { content: ''; flex: none; width: .4375rem; height: .4375rem; margin: 0 .25rem; }
    summary::after {
      border: solid var(--muted); border-width: 0 2px 2px 0;
      transform: translateY(-25%) rotate(45deg);
      transition: transform .2s;
    }
    details[open] > summary::after { transform: translateY(25%) rotate(225deg); }

    /* ── Listenzeile: Mobile zweizeilig, ab 24rem Kartenbreite einzeilig ── */
    .rows { list-style: none; margin-inline: calc(-1 * var(--sp-2)); }
    .rows > li + li { border-top: 1px solid var(--border); }
    .row {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2);
      min-height: 2.25rem; padding: var(--sp-2);
      border-radius: var(--r-sm);
    }
    summary.row { min-height: var(--tap); }
    .row-key  { flex: none; width: 3.25rem; font-weight: 700; }
    .row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-sm); color: var(--muted); }
    .row-name:first-child { font-size: var(--fs-md); color: var(--text); }
    .row .bar { order: 1; flex: 0 0 100%; }
    .row-fill { display: none; }
    .row-cell { flex: none; width: 2.75rem; text-align: right; white-space: nowrap; font-size: var(--fs-sm); color: var(--muted); }
    .row-cell.wide { width: 3.75rem; }
    .row-cell.on { font-weight: 600; color: var(--text); }
    .row.me { background: var(--raised); }
    .me .row-name { font-weight: 600; }
    .row-detail { padding: 0 var(--sp-2) var(--sp-3); }
    .row-detail .prose { margin-bottom: var(--sp-2); }
    .row-head {
      min-height: 0; margin-inline: calc(-1 * var(--sp-2)); padding-top: 0;
      border-bottom: 1px solid var(--border); border-radius: 0;
      font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    }
    .row-head .row-name, .row-head .row-cell { font-size: inherit; color: inherit; }
    .row-head .on { color: var(--text); }
    .inline .row { flex-wrap: nowrap; }
    .inline .row-name { flex: 0 1 8rem; }
    .inline .row .bar { order: 0; flex: 1 1 0; min-width: 3rem; }
    @container (min-width: 24rem) {
      .row { flex-wrap: nowrap; }
      .row-name { flex: 0 1 10rem; }
      .row .bar, .row-fill { display: block; order: 0; flex: 1 1 0; min-width: 4rem; }
    }

    /* ── Hero ───────────────────────────────────────────────── */
    .hero .scale { margin-bottom: var(--sp-4); }
    .hero .stats { margin-top: auto; }
    .hero-value { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-1) var(--sp-2); }
    .big { font-size: var(--fs-xl); font-weight: 700; line-height: 1; letter-spacing: -.03em; }
    .scale { position: relative; margin-top: var(--sp-5); }
    .scale-track { display: flex; height: .5rem; overflow: hidden; border-radius: .25rem; }
    .scale-track i { background: var(--c); opacity: .4; }
    .scale-mark {
      position: absolute; top: .25rem; left: var(--x);
      width: 1rem; height: 1rem; transform: translate(-50%, -50%);
      background: var(--c); border: 3px solid var(--surface); border-radius: 50%;
    }
    .scale-ticks { position: relative; height: 1rem; margin-top: var(--sp-1); }
    .scale-ticks span { position: absolute; left: var(--x); transform: translateX(-50%); font-size: var(--fs-xs); color: var(--muted); }
    .scale-ticks span:first-child { transform: none; }
    .scale-ticks span:last-child { transform: translateX(-100%); }
    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3);
      padding-top: var(--sp-4); border-top: 1px solid var(--border);
    }
    .stat-value { margin: var(--sp-1) 0 .125rem; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }

    /* ── Verlauf ────────────────────────────────────────────── */
    .spark { display: block; flex: 1 0 auto; width: 100%; height: 3.5rem; margin-top: var(--sp-3); overflow: visible; }
    .spark path { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .spark .spark-area { fill: var(--muted); fill-opacity: .08; stroke: none; }
    .spark .spark-dots { stroke-width: 5; }
    .spark .spark-last { stroke: var(--c); stroke-width: 9; }
    .axis { display: flex; justify-content: space-between; margin-top: var(--sp-1); }

    /* ── Methodik ───────────────────────────────────────────── */
    .methods:not([open]) > .card-head { margin-bottom: 0; }
    .methods .caption { margin-left: auto; }
    .legend { display: flex; flex-wrap: wrap; gap: var(--sp-1); }

    /* ── Upload ─────────────────────────────────────────────── */
    .upload {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-6);
      min-height: 100vh; min-height: 100dvh; padding: var(--sp-8) var(--sp-4);
      text-align: center;
    }
    .drop {
      display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);
      width: 100%; max-width: 28rem; padding: var(--sp-8) var(--sp-6);
      background: var(--surface);
      border: 2px dashed var(--border-2);
      border-radius: var(--r-lg);
      cursor: pointer;
      transition: background-color .2s, border-color .2s;
    }
    .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .drop.over { background: var(--raised); border-color: var(--c-1); }
    .drop-icon { width: 2.5rem; height: 2.5rem; margin-bottom: var(--sp-3); color: var(--muted); }
    .drop-title { font-size: var(--fs-lg); font-weight: 600; }
    .drop .btn { margin: var(--sp-5) 0 var(--sp-2); }
    @media (pointer: coarse) { .drop-hint { display: none; } }
    .error { max-width: 28rem; font-size: var(--fs-sm); color: var(--c-4); }
    .resume { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }

    @media (prefers-reduced-motion: reduce) {
      .anim .bar > i { animation: none; }
      summary::after { transition: none; }
    }
  </style>
</head>
<body>

<svg hidden>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
</svg>

<!-- ── Upload ──────────────────────────────────────────────── -->
<main class="upload" id="upload">
  <h1 class="title">Portfolio CO₂ Analyzer</h1>
  <label class="drop" id="drop">
    <input class="sr-only" type="file" id="file" accept=".csv,text/csv">
    <svg class="drop-icon" aria-hidden="true"><use href="#i-up"/></svg>
    <span class="drop-title">CSV hochladen</span>
    <span class="caption">DivvyDiary-Export · semikolongetrennt</span>
    <span class="btn">Datei auswählen</span>
    <span class="caption drop-hint">oder per Drag &amp; Drop ablegen</span>
  </label>
  <p class="error" id="error" role="alert" hidden></p>
  <div class="resume" id="resume" hidden>
    <p class="caption" id="resume-text"></p>
    <button class="btn" id="resume-btn" type="button">Analyse öffnen</button>
  </div>
  <p class="caption">Die Datei wird nur lokal in deinem Browser verarbeitet.</p>
</main>

<!-- ── Dashboard ───────────────────────────────────────────── -->
<main class="wrap" id="dash" hidden>
  <header class="top">
    <div>
      <h1 class="title">Portfolio CO₂ Analyzer</h1>
      <p class="caption" id="meta"></p>
    </div>
    <button class="btn" id="new-file" type="button"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>Neue Datei</button>
  </header>

  <div class="grid">
    <section class="card hero" id="hero"></section>
    <section class="card" id="trend" hidden></section>
  </div>

  <div class="grid">
    <section class="card">
      <header class="card-head"><h2 class="label">Benchmark-Vergleich</h2></header>
      <ul class="rows inline" id="bench"></ul>
      <p class="caption">WACI in tCO₂e/Mio.&nbsp;$ · Abweichung deines Portfolios zum Vergleichswert</p>
    </section>
    <section class="card">
      <header class="card-head"><h2 class="label">Optimierungs-Potenzial</h2></header>
      <ul class="rows inline" id="whatif"></ul>
      <p class="caption" id="whatif-note"></p>
    </section>
  </div>

  <section class="card" id="positions">
    <header class="card-head">
      <h2 class="label">Positionen</h2>
      <div class="seg" id="sort" role="group" aria-label="Sortierung"></div>
    </header>
    <p class="caption" id="pos-note"></p>
    <div class="list"></div>
    <button class="btn btn-block" type="button" data-more></button>
  </section>

  <section class="card" id="sectors">
    <header class="card-head"><h2 class="label">Sektoren</h2></header>
    <div class="list"></div>
    <button class="btn btn-block" type="button" data-more></button>
  </section>

  <details class="card methods">
    <summary class="card-head">
      <h2 class="label">Methodik &amp; Datenbasis</h2>
      <span class="caption" id="est-count"></span>
    </summary>
    <div class="prose" id="methods"></div>
  </details>
</main>

const pctFmt = [0, 1].map(d =>
  new Intl.NumberFormat('de-DE', { style: 'percent', minimumFractionDigits: d, maximumFractionDigits: d }));
const pct = x => pctFmt[Math.abs(x) >= 0.1 ? 0 : 1].format(x);
const signedPct = x => (x > 0 ? '+' : x < 0 ? '−' : '±') + pct(Math.abs(x));

const clamp01 = x => Math.min(Math.max(x, 0), 1);

const tone = rel => rel < -0.005 ? 'good' : rel > 0.005 ? 'bad' : 'flat';
const rangeOf = i => i === 0 ? `bis ${CLASSES[0].max}`
  : CLASSES[i].max === Infinity ? `über ${CLASSES[i - 1].max}`

// CSV
// ============================================================
function splitLine(line) {
  const cells = [];
  let cell = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch !== '"') cell += ch;
      else if (line[i + 1] === '"') { cell += '"'; i++; }
      else quoted = false;
    } else if (ch === '"') quoted = true;
    else if (ch === ';') { cells.push(cell.trim()); cell = ''; }
    else cell += ch;
  }
  cells.push(cell.trim());
  return cells;
}

// Versteht 1234,56 · 1.234,56 · 1234.56 · 1,234.56
function toNum(s = '') {
  s = String(s).replace(/\s/g, '');
  s = s.lastIndexOf(',') > s.lastIndexOf('.')
    ? s.replace(/\./g, '').replace(',', '.')
    : s.replace(/,/g, '');
  return parseFloat(s) || 0;
}

function parseCSV(text) {
  const [head, ...lines] = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim()).map(splitLine);
  if (!head?.includes('symbol') || !head.includes('value')) {
    throw new Error('Spalten „symbol“ und „value“ nicht gefunden. Bitte den DivvyDiary-Export (semikolongetrennt) verwenden.');
  }
  const col = Object.fromEntries(head.map((h, i) => [h, i]));
  return lines
    .map(c => ({
      symbol: c[col.symbol] || '',
      name:   c[col.name] || '',
      value:  toNum(c[col.value]),
      sector: c[col.sector] || '',
      type:   c[col.securityType] || '',
    }))
    .filter(r => r.symbol);
}

// ============================================================
// ANALYSE
// ============================================================
function fallback(sector, type) {
  return TYPE_FALLBACK[type]
    || { waci: SECTOR_WACI[sector] ?? 55, reason: `${SECTOR_DE[sector] || 'Sektor unbekannt'} – Sektordurchschnitt` };
}

function analyze(rows, date = today()) {
  const active = rows.filter(r => r.value > 0);
  if (!active.length) throw new Error('Keine Positionen mit Wert > 0 gefunden.');
  const total = active.reduce((s, r) => s + r.value, 0);

  const positions = active.map(r => {
    const known = WACI_DB[r.symbol];
    const { waci, reason } = known || fallback(r.sector, r.type);
    const weight = r.value / total;
    return {
      sym: r.symbol, name: r.name || r.symbol, val: r.value, weight, waci, reason,
      contribution: weight * waci, est: !known,
      sector: SECTOR_DE[r.sector] || SECTOR_DE[r.type] || r.sector || 'Sonstige',
    };
  });
  const waci = positions.reduce((s, p) => s + p.contribution, 0);
  for (const p of positions) p.share = p.contribution / waci;
  positions.sort((a, b) => b.contribution - a.contribution);

  const bySector = new Map();
  for (const p of positions) {
    const s = bySector.get(p.sector) || { name: p.sector, weight: 0, contribution: 0, syms: [] };
    s.weight += p.weight;
    s.contribution += p.contribution;
    s.syms.push(p.sym);
    bySector.set(p.sector, s);
  }
  const sectors = [...bySector.values()]
    .map(s => ({ ...s, share: s.contribution / waci, waci: s.contribution / s.weight }))
    .sort((a, b) => b.contribution - a.contribution);

  return {
    date, rows: active, positions, sectors, waci, total,
    footprint: waci * total * EUR_USD / 1e6,
    whatIf: whatIf(positions, waci),
  };
}

// Verkauf der größten Emittenten, Erlös anteilig ins übrige Portfolio.
// Nur Positionen über dem Portfolio-WACI senken ihn dabei.
function whatIf(positions, waci) {
  const steps = [];
  let contribution = 0, weight = 0;
  for (const p of positions) {
    if (steps.length === WHAT_IF_STEPS) break;
    if (p.waci <= waci) continue;
    contribution += p.contribution;
    weight += p.weight;
    if (weight >= 1) break;
    const next = (waci - contribution) / (1 - weight);
    steps.push({ sym: p.sym, waci: next, rel: next / waci - 1 });
  }
  return steps;
}

// SPEICHER  (Fehler blockieren nie die Analyse)

const store = {
  get(key, fallbackValue) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallbackValue; } catch { return fallbackValue; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* privat/voll – ohne Speichern weiter */ }
  },
};
const loadHistory = () => {
  const h = store.get(STORE.history, []);
  return Array.isArray(h) ? h : [];
};

function remember(a) {
  const h = loadHistory().filter(x => x.date !== a.date);
  h.push({ date: a.date, waci: +a.waci.toFixed(2), val: Math.round(a.total) });
  store.set(STORE.history, h.slice(-STORE.max));
  store.set(STORE.last, { date: a.date, rows: a.rows });
}

function restore() {
  const saved = store.get(STORE.last, null);
  // Format bis 10/2026 speicherte die komplette Analyse
  const rows = saved?.rows || saved?.positions?.map(p => ({
    symbol: p.sym, name: p.name, value: p.val, sector: p.sector === '–' ? '' : p.sector, type: p.secType,
  }));
  try { return rows ? analyze(rows, saved.date) : null; } catch { return null; }
}

const cellsOf = (cells, on = -1, wide = -1) => cells.map((c, i) =>

// Eine Zeile für alle Listen. Mit `group` wird sie aufklappbar,
// die Details entstehen erst beim ersten Öffnen (siehe DETAILS).
function row({ key, name, cls, value, cells, on, wide, group, index, me }) {
  const line = (key ? `<span class="row-key">${esc(key)}</span>` : '')
    + `<span class="row-name">${esc(name)}</span>${bar(value, cls)}${cellsOf(cells, on, wide)}`;
  return group
    ? `<li><details name="${group}" data-i="${index}"><summary class="row">${line}</summary><div class="row-detail"></div></details></li>`
    : `<li class="row${me ? ' me' : ''}">${line}</li>`;
}

// Liste mit Kopfzeile in eine Karte schreiben. Gerendert werden nur die
// sichtbaren Zeilen, der Rest erst nach „Alle anzeigen“ (Klasse .all).
function fillList(section, { title, on, items, toRow, noun, limit }) {
  const all = section.classList.contains('all');
  const shown = all ? items : items.slice(0, limit);
  $('.list', section).innerHTML = rowHead(title, on) + `<ul class="rows">${shown.map(toRow).join('')}</ul>`;
  const btn = $('[data-more]', section);
  btn.hidden = items.length <= limit;
  btn.setAttribute('aria-expanded', all);
  btn.textContent = all ? 'Weniger anzeigen' : `Alle ${items.length} ${noun} anzeigen`;
}

const pos = v => `${(clamp01(v / SCALE_MAX) * 100).toFixed(1)}%`;

function renderScale(w) {
  let from = 0;
  const zones = CLASSES.map(c => {
    const to = Math.min(c.max, SCALE_MAX);
    const zone = `<i class="${c.key}" style="flex:${to - from}"></i>`;
    from = to;
    return zone;
  }).join('');
  const ticks = [0, ...CLASSES.slice(0, -1).map(c => c.max), SCALE_MAX]
    .map(v => `<span style="--x:${pos(v)}">${v === SCALE_MAX ? `${v}+` : v}</span>`).join('');
  return `<div class="scale" role="img" aria-label="Skala 0 bis ${SCALE_MAX}, dein Portfolio bei ${num(w)}">
      <div class="scale-track">${zones}</div>
      <span class="scale-mark ${classOf(w).key}" style="--x:${pos(w)}"></span>
      <div class="scale-ticks" aria-hidden="true">${ticks}</div>
    </div>`;
}

const stat = (label, value, cls, sub) =>

      ${stat('Wert', eur(a.total), '', `${a.positions.length} Positionen`)}

function renderBench(a) {
  return [...BENCHMARKS, { name: 'Dein Portfolio', v: a.waci, me: true }]
    .sort((x, y) => x.v - y.v)
    .map(b => {
      const rel = a.waci / b.v - 1;
      return row({
        name: b.name, cls: classOf(b.v).key, value: b.v / SCALE_MAX, me: b.me, wide: 1,
        cells: [(b.est ? '≈' : '') + num(b.v), b.me ? '' : pill(signedPct(rel), tone(rel))],
      });
    }).join('');
}

function renderWhatIf(a) {
  if (!a.whatIf.length) return '';
  const base = row({ name: 'Heute', cls: classOf(a.waci).key, value: a.waci / SCALE_MAX, me: true, cells: [num(a.waci), ''], wide: 1 });
  return base + a.whatIf.map((s, i) => row({
    name: `${i ? '+ ' : ''}${s.sym} verkaufen`, cls: classOf(s.waci).key, value: s.waci / SCALE_MAX, wide: 1,
    cells: [num(s.waci), pill(signedPct(s.rel), tone(s.rel))],
  })).join('');
}

function renderTrend(h) {
  const n = h.length;
  const vals = h.map(x => x.waci);
  const last = vals[n - 1], prev = vals[n - 2], rel = last / prev - 1;
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.2 || 1;
  const X = i => (i / (n - 1) * 100).toFixed(2);
  const Y = v => (36 - (v - lo + pad) / (hi - lo + 2 * pad) * 32).toFixed(2);
  const pts = vals.map((v, i) => `${X(i)} ${Y(v)}`);
  const line = `M${pts.join('L')}`;
  return `<header class="card-head"><h2 class="label">WACI-Verlauf · ${n} Messungen</h2>${pill(signedPct(rel), tone(rel))}</header>
    <p class="caption">Vorherige Messung: ${num(prev)} am ${fmtDate(h[n - 2].date)}</p>
    <svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="WACI von ${num(vals[0])} auf ${num(last)}">
      <path class="spark-area" d="${line}L100 40L0 40Z"/>
      <path d="${line}"/>
      <path class="spark-dots" d="${pts.map(p => `M${p}h0`).join('')}"/>
      <path class="spark-last ${classOf(last).key}" d="M${pts[n - 1]}h0"/>
    </svg>
    <div class="axis caption"><span>${fmtDate(h[0].date)}</span><span>${fmtDate(h[n - 1].date)}</span></div>`;
}

function renderPositions(key = sortKey) {
  sortKey = key;
  const a = current;
  const { val, dir, note } = SORTS[key];
  const on = SORT_KEYS.indexOf(key);
  const list = [...a.positions].sort((x, y) => dir * (val(x) - val(y)) || y.contribution - x.contribution);
  const max = Math.max(...list.map(val)) || 1;
  $('#pos-note').textContent = note(a) + (a.positions.some(p => p.est) ? ' · ≈ Schätzwert' : '');
  for (const b of $('#sort').children) b.setAttribute('aria-pressed', b.dataset.sort === key);
  rendered.pos = list;
  fillList($('#positions'), {
    title: 'Position', on, items: list, noun: 'Positionen', limit: PREVIEW.positions,
    toRow: (p, i) => row({
      key: p.sym, name: p.name, cls: classOf(p.waci).key, value: val(p) / max, on, group: 'pos', index: i,
      cells: [pct(p.share), (p.est ? '≈' : '') + num(p.waci, 0), pct(p.weight)],
    }),
  });
}

function renderSectors() {
  const { sectors } = current;
  const max = Math.max(...sectors.map(s => s.share)) || 1;
  rendered.sec = sectors;
  fillList($('#sectors'), {
    title: 'Sektor', on: 0, items: sectors, noun: 'Sektoren', limit: PREVIEW.sectors,
    toRow: (s, i) => row({
      name: s.name, cls: classOf(s.waci).key, value: s.share / max, on: 0, group: 'sec', index: i,
      cells: [pct(s.share), num(s.waci, 0), pct(s.weight)],
    }),
  });
}
const LISTS = { positions: renderPositions, sectors: renderSectors };

function renderMethods(a) {
  const est = a.positions.filter(p => p.est).map(p => p.sym);
  $('#est-count').textContent = est.length ? `${est.length} Schätzwert${est.length > 1 ? 'e' : ''}` : '';
  $('#methods').innerHTML = `
    <p><strong>WACI</strong> (Weighted Average Carbon Intensity): Summe aus Gewicht × CO₂-Intensität aller Positionen in tCO₂e je Mio.${NBSP}$ Umsatz, Scope 1+2.</p>
    <p class="legend">${CLASSES.map((c, i) => pill(`${c.label} ${rangeOf(i)}`, c.key)).join('')}</p>
    <p><strong>Datenbasis:</strong> öffentliche Branchendurchschnitte (MSCI ESG, Sustainalytics, CDP, 2022–2024), keine verifizierten Unternehmensdaten, Unsicherheit ±20–30${NBSP}%. ETF-Werte sind gewichtete Sektordurchschnitte.</p>
    ${est.length ? `<p><strong>≈ Schätzwerte:</strong> ${esc(est.join(', '))} stehen nicht in der Datenbank, verwendet wird der Sektordurchschnitt.</p>` : ''}
    <p><strong>Fußabdruck:</strong> Näherung aus WACI × investiertem Betrag (1${NBSP}€ = ${num(EUR_USD, 2)}${NBSP}$). Exakte finanzierte Emissionen bräuchten den Unternehmenswert (EVIC). Ein Transatlantikflug ≈ ${num(FLIGHT_T)}${NBSP}t CO₂e.</p>`;
}

// ============================================================
// APP
// ============================================================
let current = null;
let sortKey = 'share';

function render(a) {
  current = a;
  $('#meta').textContent = `Stand: ${fmtDate(a.date)}`;
  $('#hero').innerHTML = renderHero(a);
  $('#bench').innerHTML = renderBench(a);
  $('#whatif').innerHTML = renderWhatIf(a);
  $('#whatif-note').textContent = a.whatIf.length
    ? 'Verkauf der größten Emittenten, Erlös anteilig ins übrige Portfolio'
    : 'Keine Position liegt über deinem Portfolio-WACI – ein Verkauf würde ihn nicht senken.';
  const history = loadHistory();
  $('#trend').hidden = history.length < 2;
  $('#trend').innerHTML = history.length < 2 ? '' : renderTrend(history);
  for (const s of document.querySelectorAll('#dash section')) s.classList.remove('all');
  renderPositions('share');
  renderSectors();
  renderMethods(a);

  const dash = $('#dash');
  dash.classList.add('anim');
  setTimeout(() => dash.classList.remove('anim'), 1000);
  show(true);
}

function show(dashboard) {
  $('#upload').hidden = dashboard;
  $('#dash').hidden = !dashboard;
  if (!dashboard) updateResume();
  window.scrollTo(0, 0);
}

function updateResume() {
  current ??= restore();
  $('#resume').hidden = !current;
  if (current) $('#resume-text').textContent = `Letzte Analyse vom ${fmtDate(current.date)} · WACI ${num(current.waci)}`;
}

function setError(msg) {
  $('#error').textContent = msg;
  $('#error').hidden = !msg;
}

async function load(file) {
  if (!file) return;
  setError('');
  if (!/\.csv$/i.test(file.name)) return setError('Bitte eine CSV-Datei auswählen.');
  try {
    const a = analyze(parseCSV(await file.text()));
    remember(a);
    render(a);
  } catch (err) {
    setError(err.message);
  }
}

// ── Events ───────────────────────────────────────────────────
const drop = $('#drop');
const fileInput = $('#file');
fileInput.addEventListener('change', () => { load(fileInput.files[0]); fileInput.value = ''; });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', e => { if (!drop.contains(e.relatedTarget)) drop.classList.remove('over'); });
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });
$('#resume-btn').addEventListener('click', () => render(current));
$('#new-file').addEventListener('click', () => show(false));

$('#sort').innerHTML = SORT_KEYS
  .map(k => `<button type="button" data-sort="${k}" aria-pressed="false">${SORTS[k].label}</button>`).join('');
$('#dash').addEventListener('click', e => {
  // Klick auf eine Zeile kommt vor dem Öffnen: Details genau dann füllen
  const details = e.target.closest('summary.row')?.parentElement;
  if (details) {
    if (!details.open && !details.dataset.ready) {
      const group = details.getAttribute('name');
      details.lastElementChild.innerHTML = DETAILS[group](rendered[group][details.dataset.i]);
      details.dataset.ready = '1';
    }
    return;
  }
  const t = e.target.closest('[data-sort], [data-more]');
  if (!t) return;
  if (t.dataset.sort) return renderPositions(t.dataset.sort);
  const section = t.closest('section');
  const open = section.classList.toggle('all');
  LISTS[section.id]();
  if (!open) t.scrollIntoView({ block: 'nearest' });
});

updateResume();
</script>
</body>
</html>
